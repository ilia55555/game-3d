<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abandoned Grounds</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif;user-select:none}
  canvas{display:block}
  .ui{position:fixed;pointer-events:none}
  #cross{left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 2px #000}
  #weap{right:16px;bottom:16px;color:#fff;background:#0008;padding:8px 12px;border-radius:6px;font-size:14px;direction:rtl}
  #start{inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#fff;background:#0007;pointer-events:auto;cursor:pointer;text-align:center;direction:rtl;font-size:15px;line-height:1.9}
  #start h1{margin:0;font-size:34px;letter-spacing:2px}
  #scope{inset:0;opacity:0;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 33vmin,rgba(0,0,0,.6) 33.5vmin,#000 34.5vmin)}
  #scope:before,#scope:after{content:"";position:absolute;background:#000;left:50%;top:50%}
  #scope:before{width:64vmin;height:2px;margin:-1px 0 0 -32vmin}
  #scope:after{width:2px;height:64vmin;margin:-32vmin 0 0 -1px}
  #scope i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#e22}
  #flash{inset:0;background:#fff4d8;opacity:0}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>

<body>
<div id="scope" class="ui"><i></i></div>
<div id="cross" class="ui"></div>
<div id="flash" class="ui"></div>
<div id="weap" class="ui"></div>
<div id="start" class="ui"><h1>ABANDONED GROUNDS</h1>
<div>برای شروع کلیک کن</div>
<div style="font-size:13px;opacity:.85">WASD حرکت · Shift دویدن · Space پرش · ماوس نگاه<br>کلیک چپ شلیک · کلیک راست دوربین تفنگ<br>2 = C4 · کلیک چپ کار گذاشتن · F یا کلیک راست انفجار · 1 = تفنگ</div></div>
<script type="module">
import * as THREE from 'three';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xfff0dd,0.25));
const SKY = 0xd8c9a8;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 40, 150);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 400);
scene.add(camera);

// ---------- lights: low warm sun → long shadows ----------
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6a5a40, 1.0));
const sun = new THREE.DirectionalLight(0xffd9a0, 2.2);
sun.position.set(-70, 26, 50); // low angle
sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096);
const sc = sun.shadow.camera; sc.left=-90; sc.right=90; sc.top=90; sc.bottom=-90; sc.near=1; sc.far=260;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun); scene.add(sun.target);

// ---------- procedural textures ----------
function canvasTex(size, draw, repeat=1){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'); draw(g,size);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat,repeat);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function noise(g,s,base,n,var_,sz=[1,4]){
  g.fillStyle=base; g.fillRect(0,0,s,s);
  for(let i=0;i<n;i++){const v=rnd(-var_,var_);g.fillStyle=`rgba(${v>0?255:0},${v>0?255:0},${v>0?255:0},${Math.abs(v)})`;const w=rnd(...sz);g.fillRect(rnd(0,s),rnd(0,s),w,w);}
}
const texGrass=canvasTex(256,(g,s)=>{noise(g,s,'#5d6b34',9000,0.12);for(let i=0;i<40;i++){g.fillStyle=`rgba(110,90,50,${rnd(.1,.3)})`;g.beginPath();g.arc(rnd(0,s),rnd(0,s),rnd(6,20),0,7);g.fill();}},60);
const texConcrete=canvasTex(256,(g,s)=>{noise(g,s,'#8a867d',7000,0.1);g.strokeStyle='rgba(40,35,30,.5)';for(let i=0;i<6;i++){g.beginPath();let x=rnd(0,s),y=rnd(0,s);g.moveTo(x,y);for(let k=0;k<6;k++){x+=rnd(-20,20);y+=rnd(5,25);g.lineTo(x,y);}g.stroke();}for(let i=0;i<10;i++){g.fillStyle=`rgba(50,60,30,${rnd(.1,.25)})`;g.fillRect(rnd(0,s),s-rnd(0,60),rnd(10,60),rnd(10,60));}});
const texStone=canvasTex(256,(g,s)=>{g.fillStyle='#4a463f';g.fillRect(0,0,s,s);const h=32;for(let r=0;r<s/h;r++){const off=(r%2)*24;for(let x=-off;x<s;x+=48){const l=rnd(95,140);g.fillStyle=`rgb(${l},${l-5},${l-14})`;g.fillRect(x+2,r*h+2,44,h-4);}}noise(g,s,'rgba(0,0,0,0)',3000,0.12);});
const texWood=canvasTex(256,(g,s)=>{for(let x=0;x<s;x+=32){const l=rnd(70,100);g.fillStyle=`rgb(${l+30},${l},${l-30})`;g.fillRect(x,0,32,s);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(x,0,2,s);for(let i=0;i<30;i++){g.fillStyle=`rgba(40,25,10,${rnd(.1,.3)})`;g.fillRect(x+rnd(2,30),rnd(0,s),1,rnd(10,60));}}});
const texRust=canvasTex(256,(g,s)=>{noise(g,s,'#b8862a',6000,0.15);for(let i=0;i<60;i++){g.fillStyle=`rgba(${rnd(90,140)},${rnd(40,60)},20,${rnd(.2,.6)})`;g.beginPath();g.arc(rnd(0,s),rnd(0,s),rnd(3,18),0,7);g.fill();}});
const texBark=canvasTex(128,(g,s)=>{g.fillStyle='#3b2b1c';g.fillRect(0,0,s,s);for(let i=0;i<200;i++){g.fillStyle=`rgba(${rnd(60,100)},${rnd(45,70)},30,.6)`;g.fillRect(rnd(0,s),rnd(0,s),rnd(1,3),rnd(8,30));}});
const texLeaf=canvasTex(128,(g,s)=>{noise(g,s,'#2f4a22',3000,0.18,[2,6]);});
const texRoof=canvasTex(128,(g,s)=>{g.fillStyle='#4a2b20';g.fillRect(0,0,s,s);for(let y=0;y<s;y+=12)for(let x=(y/12%2)*8;x<s;x+=16){const l=rnd(60,90);g.fillStyle=`rgb(${l},${l*.55},${l*.4})`;g.fillRect(x+1,y+1,14,10);}});

const M = {
  concrete:new THREE.MeshStandardMaterial({map:texConcrete,roughness:.95}),
  stone:new THREE.MeshStandardMaterial({map:texStone,roughness:.9}),
  wood:new THREE.MeshStandardMaterial({map:texWood,roughness:.85}),
  rust:new THREE.MeshStandardMaterial({map:texRust,roughness:.7,metalness:.4}),
  bark:new THREE.MeshStandardMaterial({map:texBark,roughness:1}),
  leaf:new THREE.MeshStandardMaterial({map:texLeaf,roughness:.9,flatShading:true}),
  roof:new THREE.MeshStandardMaterial({map:texRoof,roughness:.9}),
  dark:new THREE.MeshStandardMaterial({color:0x111111,roughness:.6}),
  dirt:new THREE.MeshStandardMaterial({color:0x4a3a28,roughness:1}),
};

// =====================================================================
// BLOCK SYSTEM — every world object is made of destructible blocks
// =====================================================================
const G={cube:new THREE.BoxGeometry(1,1,1),cyl:new THREE.CylinderGeometry(.5,.5,1,12),cone8:new THREE.ConeGeometry(.5,1,8),cone4:new THREE.ConeGeometry(.5,1,4),ico:new THREE.IcosahedronGeometry(.5,0)};
for(const k in G) G[k].computeBoundingBox();
const HP={concrete:90,stone:130,wood:50,rust:70,bark:60,leaf:15,roof:45,dark:20,dirt:20};
const blocks=[];
function addBlock(geom,mat,sx,sy,sz,x,y,z,rot=null,col=true){
  const pos=new THREE.Vector3(x,y,z);
  const quat=new THREE.Quaternion(); if(rot) quat.setFromEuler(new THREE.Euler(rot[0],rot[1],rot[2]));
  const scale=new THREE.Vector3(sx,sy,sz);
  const matrix=new THREE.Matrix4().compose(pos,quat,scale);
  const box=G[geom].boundingBox.clone().applyMatrix4(matrix);
  const b={id:blocks.length,geom,mat,pos,quat,scale,matrix,box,col,hp:HP[mat],alive:true,
    color:new THREE.Color().setScalar(rnd(.8,1.05)),nb:null,stamp:0,im:null,idx:0};
  blocks.push(b); return b;
}
// box: unrotated boxes are split into ~1m blocks; rotated ones are a single block
function box(w,h,d,x,y,z,mat,{col=true,ry=0,rot=null}={}){
  if(ry) rot=[0,ry,0];
  if(rot){addBlock('cube',mat,w,h,d,x,y,z,rot,col);return;}
  const nx=Math.max(1,Math.round(w)),ny=Math.max(1,Math.round(h)),nz=Math.max(1,Math.round(d));
  const cw=w/nx,ch=h/ny,cd=d/nz;
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)for(let k=0;k<nz;k++)
    addBlock('cube',mat,cw,ch,cd,x-w/2+(i+.5)*cw,y-h/2+(j+.5)*ch,z-d/2+(k+.5)*cd,null,col);
}
const staticColliders=[];

// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({map:texGrass,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// burn overlay (scorched grass) + glowing embers, painted on canvases
const burnCv=document.createElement('canvas'); burnCv.width=burnCv.height=1024;
const bctx=burnCv.getContext('2d');
const emberCv=document.createElement('canvas'); emberCv.width=emberCv.height=512;
const ectx=emberCv.getContext('2d'); ectx.fillStyle='#000'; ectx.fillRect(0,0,512,512);
const burnTex=new THREE.CanvasTexture(burnCv); burnTex.colorSpace=THREE.SRGBColorSpace;
const emberTex=new THREE.CanvasTexture(emberCv); emberTex.colorSpace=THREE.SRGBColorSpace;
const burnPlane=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({map:burnTex,emissive:0xffffff,emissiveMap:emberTex,emissiveIntensity:2.5,transparent:true,depthWrite:false,roughness:1,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));
burnPlane.rotation.x=-Math.PI/2; burnPlane.position.y=.01; burnPlane.receiveShadow=true; scene.add(burnPlane);
let burnDirty=false,emberDirty=false,emberActive=0,emberFadeT=0;
function scorch(x,z,r,a){
  const px=(x+100)*5.12,py=(z+100)*5.12,pr=r*5.12;
  for(let i=0;i<5;i++){
    const ox=px+rnd(-.35,.35)*pr,oy=py+rnd(-.35,.35)*pr,rr=pr*rnd(.55,1);
    const g=bctx.createRadialGradient(ox,oy,0,ox,oy,rr);
    g.addColorStop(0,`rgba(10,8,6,${a})`); g.addColorStop(.55,`rgba(22,16,10,${a*.75})`); g.addColorStop(1,'rgba(40,28,15,0)');
    bctx.fillStyle=g; bctx.beginPath(); bctx.arc(ox,oy,rr,0,7); bctx.fill();
  }
  for(let i=0;i<pr*2;i++){const an=rnd(0,7),d=rnd(0,pr*.85);
    bctx.fillStyle=`rgba(${rnd(70,120)|0},${rnd(65,110)|0},${rnd(60,100)|0},${rnd(.15,.45)*a})`;
    bctx.fillRect(px+Math.cos(an)*d,py+Math.sin(an)*d,rnd(1,2.5),rnd(1,2.5));}
  burnDirty=true;
}
function embers(x,z,r){
  const px=(x+100)*2.56,py=(z+100)*2.56,pr=r*2.56;
  for(let i=0;i<pr*6;i++){const an=rnd(0,7),d=Math.sqrt(Math.random())*pr;
    ectx.fillStyle=`rgb(255,${rnd(60,150)|0},${rnd(0,30)|0})`;
    ectx.fillRect(px+Math.cos(an)*d,py+Math.sin(an)*d,rnd(.6,2),rnd(.6,2));}
  emberDirty=true; emberActive=10;
}

// ---------- abandoned building (center) ----------
(function(){
  const cx=0,cz=0,W=16,D=12,H=3.4,t=.4;
  for(let f=0;f<2;f++){
    const y=f*H;
    const segs=f===0?[[-W/2,-1.2],[1.2,W/2]]:[[-W/2,-5],[-3,-1],[1,3],[5,W/2]];
    for(const [a,b] of segs) box(b-a,H,t,cx+(a+b)/2,y+H/2,cz+D/2,'concrete');
    if(f===1) for(const x of [-4,0,4]){box(2,1,t,cx+x,y+.5,cz+D/2,'concrete');box(2,.6,t,cx+x,y+H-.3,cz+D/2,'concrete');}
    if(f===0) box(2.4,.8,t,cx,y+H-.4,cz+D/2,'concrete');
    box(W,f===1?1.6:H,t,cx,y+(f===1?.8:H/2),cz-D/2,'concrete');
    for(const s of [-1,1]){
      box(t,H,4,cx+s*W/2,y+H/2,cz-4,'concrete'); box(t,H,4,cx+s*W/2,y+H/2,cz+4,'concrete');
      box(t,1,4,cx+s*W/2,y+.5,cz,'concrete'); box(t,.6,4,cx+s*W/2,y+H-.3,cz,'concrete');
    }
  }
  box(W,.3,D-4,cx,H,cz+2,'concrete');
  box(W-5,.3,4,cx+2.5,H,cz-4,'concrete');
  box(W*.6,.3,D*.7,cx-3,2*H,cz+1,'concrete');
  for(let i=0;i<12;i++){const h=.3+i*.29; box(4.5,h,.34,cx-W/2+2.6,h/2,cz-D/2+.6+i*.34,'concrete');}
  for(let i=0;i<14;i++) box(rnd(.3,1),rnd(.2,.6),rnd(.3,1),cx+rnd(-W/2+5,W/2-1),.15,cz+rnd(-D/2+1,D/2-1),'concrete',{col:false,ry:rnd(.1,3)});
})();

// ---------- stone tower (north) ----------
(function(){
  const x=-6,z=-45,R=4,H=16,N=56;
  for(let r=0;r<H;r++) for(let s=0;s<24;s++){
    const a=(s+(r%2)*.5)/24*Math.PI*2;
    addBlock('cube','stone',1.12,1,.8,x+Math.cos(a)*R,r+.5,z+Math.sin(a)*R,[0,-a-Math.PI/2,0]);
  }
  for(let i=-4;i<=4;i++) for(let k=-4;k<=4;k++){
    if(Math.hypot(i,k)*1.02>R+.15) continue;
    addBlock('cube','stone',1.02,.6,1.02,x+i*1.02,H+.3,z+k*1.02);
  }
  const aEnd=((N-1)/N*Math.PI*2*1.6)%(Math.PI*2);
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;
    let da=Math.abs(a-aEnd); da=Math.min(da,Math.PI*2-da); if(da<.45) continue;
    box(1,1.2,.6,x+Math.cos(a)*(R+.3),H+1.2,z+Math.sin(a)*(R+.3),'stone',{ry:-a+Math.PI/2});}
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2*1.6, y=.2+i*(H/N);
    box(1.8,.3,1.1,x+Math.cos(a)*(R+1.3),y,z+Math.sin(a)*(R+1.3),'stone',{ry:-a+1e-4});
  }
})();

// ---------- cabin (west) ----------
(function(){
  const x=-40,z=6,W=6,D=5,H=2.8,t=.25;
  box(W,H,t,x,H/2,z-D/2,'wood');
  box(t,H,D,x-W/2,H/2,z,'wood'); box(t,H,D,x+W/2,H/2,z,'wood');
  box(2,H,t,x-2,H/2,z+D/2,'wood'); box(2,H,t,x+2,H/2,z+D/2,'wood'); box(2,.6,t,x,H-.3,z+D/2,'wood');
  box(W,.15,D,x,.07,z,'wood');
  const r=Math.hypot(W,D)/2+.6;
  addBlock('cone4','roof',2*r,2.4,2*r*D/W,x,H+1.2,z,[0,Math.PI/4,0]);
  box(.6,1.6,.6,x+1.8,H+1.5,z-1,'stone');
  for(let i=0;i<4;i++) box(.5,.5,1.6,x-W/2-1.2,.25+i*.5*(i<2?1:0),z+rnd(-2,2),'wood',{ry:rnd(-.3,.3)||.01});
})();

// ---------- crane (east) ----------
(function(){
  const x=38,z=-8,H=26,L=1.8;
  for(const [dx,dz] of [[-1,-1],[1,-1],[1,1],[-1,1]]) box(.18,H,.18,x+dx*L/2,H/2,z+dz*L/2,'rust');
  for(let y=1.5;y<H;y+=2){
    for(const r of [0,1]) for(const s of [-1,1])
      addBlock('cube','rust',.1,2.7,.1,x+(r?s*L/2:0),y,z+(r?0:s*L/2),[r?Math.PI/4*s:0,0,r?0:Math.PI/4*s],false);
    box(L,.1,.1,x,y-1,z-L/2,'rust'); box(L,.1,.1,x,y-1,z+L/2,'rust');
    box(.1,.1,L,x-L/2,y-1,z,'rust'); box(.1,.1,L,x+L/2,y-1,z,'rust');
  }
  box(3,1.2,3,x,.6,z,'concrete');
  box(2.2,2,2.2,x,H+1,z,'rust');
  box(28,.8,1,x-12,H+2.4,z,'rust');
  box(9,.8,1,x+5.5,H+2.4,z,'rust');
  box(2.5,2,1.6,x+9,H+1.3,z,'concrete');
  box(.4,4,.4,x,H+4.8,z,'rust');
  box(.05,16,.05,x-20,H+2-8,z,'dark');
  box(2.5,1.2,1.5,x-20,H-14.6,z,'wood');
})();

// ---------- ruins (south) ----------
(function(){
  const x=8,z=40;
  const walls=[[-8,0,10,3.5],[-3,-5,.7,2.2],[4,3,6,1.4],[-10,6,.7,4],[9,-4,.7,2.8],[0,8,8,.9]];
  for(const [dx,dz,w,h] of walls){
    const horiz=w>1;
    const n=Math.max(1,Math.round((horiz?w:4)/1.2));
    for(let i=0;i<n;i++){
      const hh=h*rnd(.4,1);
      if(horiz) box(w/n,hh,.8,x+dx-w/2+(i+.5)*w/n,hh/2,z+dz,'stone');
      else box(.8,hh,4/n,x+dx,hh/2,z+dz-2+(i+.5)*4/n,'stone');
    }
  }
  for(const [dx,dz,h] of [[-4,2,5],[-1,2,3.2],[2,2,4.4],[5,2,1.2]]){
    const n=Math.max(1,Math.round(h)),sh=h/n;
    for(let k=0;k<n;k++) addBlock('cyl','stone',.97,sh,.97,x+dx,(k+.5)*sh,z+dz);
  }
  for(let k=0;k<5;k++){const ox=Math.cos(.4)*(k-2),oz=-Math.sin(.4)*(k-2);
    addBlock('cyl','stone',.95,1,.95,x+4+ox,.47,z-1.5+oz,[0,.4,Math.PI/2]);}
  for(let i=0;i<25;i++) box(rnd(.3,.9),rnd(.2,.5),rnd(.3,.9),x+rnd(-12,12),.15,z+rnd(-7,10),'stone',{col:false,ry:rnd(.1,3)});
})();

// ---------- trees ----------
(function(){
  const avoid=[[0,0,14],[-6,-45,9],[-40,6,7],[38,-8,6],[8,40,15],[0,25,3]];
  let placed=0;
  while(placed<70){
    const x=rnd(-95,95),z=rnd(-95,95);
    if(avoid.some(([ax,az,r])=>Math.hypot(x-ax,z-az)<r)) continue;
    const s=rnd(.8,1.5), h=4*s;
    for(let k=0;k<3;k++){const r=(.3+(.18-.3)*(k+.5)/3)*s; addBlock('cyl','bark',2*r,h/3,2*r,x,(k+.5)*h/3,z);}
    const pine=Math.random()<.5;
    for(let k=0;k<(pine?3:2);k++){
      const ry=rnd(0,3);
      if(pine){const r=(2-k*.5)*s; addBlock('cone8','leaf',2*r,2.6*s,2*r,x,h+k*1.3*s-.3,z,[0,ry,0],false);}
      else{const r=(1.8-k*.4)*s; addBlock('ico','leaf',2*r,2*r,2*r,x+rnd(-.4,.4),h+k*1.2*s,z,[0,ry,0],false);}
    }
    placed++;
  }
  for(const [a,b] of [[[-101,0,-101],[101,50,-100]],[[-101,0,100],[101,50,101]],[[-101,0,-101],[-100,50,101]],[[100,0,-101],[101,50,101]]])
    staticColliders.push(new THREE.Box3(new THREE.Vector3(...a),new THREE.Vector3(...b)));
})();

// ---------- instancing, spatial grid, neighbour graph ----------
const ZERO=new THREE.Matrix4().makeScale(0,0,0);
(function(){
  const byKey={};
  for(const b of blocks)(byKey[b.geom+'|'+b.mat]??=[]).push(b);
  for(const key in byKey){
    const list=byKey[key],[g,m]=key.split('|');
    const im=new THREE.InstancedMesh(G[g],M[m],list.length);
    im.castShadow=im.receiveShadow=true; im.frustumCulled=false;
    list.forEach((b,i)=>{b.im=im;b.idx=i;im.setMatrixAt(i,b.matrix);im.setColorAt(i,b.color);});
    scene.add(im);
  }
})();
const CELL=4,grid=new Map();
const ck=(ix,iz)=>(ix+500)*1000+(iz+500);
let stampN=0;

function spawnDebris(geom,mat,scale,pos,quat,vel,opts={}){

  m.castShadow=m.receiveShadow=true; scene.add(m);

    hh:(scale.x+scale.y+scale.z)/6});

function updateDebris(dt){

      }

let AC=null,master,noiseBuf;
function initAudio(){
  if(AC){AC.resume();return;}
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=8;
  master=AC.createGain(); master.gain.value=.8; master.connect(comp); comp.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function nz(t0,dur,type,f0,f1,q,peak,att=.002){

  const f=AC.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(f0,t0); if(f1) f.frequency.exponentialRampToValueAtTime(f1,t0+dur); f.Q.value=q;

  s.connect(f); f.connect(g); g.connect(master); s.start(t0,Math.random()*1.5); s.stop(t0+dur+.05);
}
function tone(t0,dur,type,f0,f1,peak,att=.003){
  const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t0); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(peak,t0+att); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);

  const nearGround=pos.y-floorAt(pos.x,pos.z,pos.y+.2)<2.5;
  if(nearGround){
    for(let i=0;i<22;i++){const a=rnd(0,7),dir=V(Math.cos(a),0,Math.sin(a));
      spawnSprite({type:'smoke',pos:pos.clone().add(V(0,.4,0)),vel:dir.multiplyScalar(rnd(10,18)).add(V(0,rnd(.3,1.5),0)),life:rnd(1.5,2.5),s0:1.5,s1:5,op:.6,drag:2.4,c0:new THREE.Color(.42,.36,.27),c1:new THREE.Color(.55,.5,.42),fadeIn:.05});}
    for(let i=0;i<24;i++){const dir=rdir();dir.y=Math.abs(dir.y)+.3;const s=rnd(.1,.3);
      spawnDebris('cube','dirt',V(s,s,s),pos.clone().add(V(0,.3,0)),new THREE.Quaternion(),dir.multiplyScalar(rnd(6,18)),{burn:Math.random()<.2?rnd(.6,1.4):0});}
  }
  // blocks
  let spawned=0;
  for(const b of query(pos.x-R*1.8,pos.z-R*1.8,pos.x+R*1.8,pos.z+R*1.8)){
    if(!b.alive) continue;
    const dd=b.box.distanceToPoint(pos);
    if(dd>R*1.8) continue;
    let kill=dd<R*rnd(.65,1);
    if(!kill&&dd<R*1.5){b.hp-=220*(1-dd/(R*1.5));kill=b.hp<=0;}
    if(!kill){tintBlock(b,.35+.65*dd/(R*1.8));
      if(b.mat==='leaf'&&Math.random()<.6) addFire(b.pos,1.3,rnd(4,9),rnd(0,1.5),b);
      continue;}
    hideBlock(b);
    if(spawned<160){
      const dir=b.pos.clone().sub(pos).normalize(),sp=(1-Math.min(1,dd/(R*1.5)))*24+rnd(3,9);
      const pieces=spawned<70?2:1, f=pieces===2?.5:.7;
      for(let k=0;k<pieces;k++){
        const v=dir.clone().multiplyScalar(sp).add(rdir().multiplyScalar(4)); v.y+=rnd(3,10);
        spawnDebris(b.geom,b.mat,b.scale.clone().multiplyScalar(f*rnd(.8,1.1)),b.pos.clone().add(rdir().multiplyScalar(.2)),b.quat,v,{burn:Math.random()<.3?rnd(1,2.5):0});
        spawned++;
      }
    }
  }
  // burning grass spreading outward
  if(nearGround&&pos.y<1.5){
    scorch(pos.x,pos.z,R*.9,1); embers(pos.x,pos.z,R*.8);
    for(let i=0;i<18;i++){const a=rnd(0,7),r=rnd(1,R*1.7);const p=V(pos.x+Math.cos(a)*r,0,pos.z+Math.sin(a)*r);
      if(floorAt(p.x,p.z,.5)>.2) continue; p.y=.05;
      addFire(p,rnd(.8,1.6),rnd(4,10),r/R*1.3);}
  }
  // chain reaction & knockback
  for(const c of c4s) if(c.m.position.distanceTo(pos)<R*1.6) timers.push({t:rnd(.08,.22),fn:()=>detonate(c)});
  if(d<R*1.8){const k=(1-d/(R*1.8))*12;const dir=player.pos.clone().sub(pos);dir.y=0;dir.normalize();
    player.vel.addScaledVector(dir,k);player.vel.y+=k*.4;player.onGround=false;}
  supportCheck();
}

// =====================================================================
// VIEWMODELS — rifle with scope, C4 in hand
// =====================================================================
const gun=new THREE.Group();
const gunMetal=new THREE.MeshStandardMaterial({color:0x2a2c2e,roughness:.4,metalness:.5});
const gunWood=new THREE.MeshStandardMaterial({map:texWood,roughness:.7});
const part=(w,h,d,x,y,z,m,rx=0)=>{const p=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);p.position.set(x,y,z);p.rotation.x=rx;gun.add(p);return p;};
part(.07,.09,.42,0,0,0,gunMetal);
part(.03,.03,.45,0,.015,-.4,gunMetal);
part(.05,.05,.22,0,-.01,-.3,gunWood);
part(.05,.14,.06,0,-.1,.0,gunMetal,.35);
part(.045,.11,.05,0,-.09,.15,gunWood,-.3);
part(.06,.08,.22,0,-.02,.3,gunWood);
part(.02,.03,.03,0,.06,-.1,gunMetal); part(.02,.03,.03,0,.06,.08,gunMetal);
const scopeTube=new THREE.Mesh(new THREE.CylinderGeometry(.026,.026,.26,14),gunMetal); scopeTube.rotation.x=Math.PI/2; scopeTube.position.set(0,.09,-.01); gun.add(scopeTube);
for(const zz of [-.15,.13]){const r=new THREE.Mesh(new THREE.CylinderGeometry(.034,.03,.05,14),gunMetal);r.rotation.x=Math.PI/2;r.position.set(0,.09,zz);gun.add(r);}
const lens=new THREE.Mesh(new THREE.CircleGeometry(.03,14),new THREE.MeshStandardMaterial({color:0x223a55,metalness:.9,roughness:.1}));lens.position.set(0,.09,-.176);lens.rotation.y=Math.PI;gun.add(lens);
const muzzle=new THREE.Sprite(new THREE.SpriteMaterial({map:fireTex,color:0xffc070,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:false}));
muzzle.position.set(0,.015,-.68); muzzle.visible=false; gun.add(muzzle);
const muzzleLight=new THREE.PointLight(0xffa040,0,8,2); muzzleLight.position.set(0,0,-.7); gun.add(muzzleLight);
gun.traverse(o=>{if(o.isMesh)o.castShadow=false;});
gun.scale.setScalar(.75);
const HIP=V(.22,-.2,-.45),ADS=V(0,-.0675,-.3);
gun.position.copy(HIP); camera.add(gun);

const c4Hand=new THREE.Group();
{const c=makeC4();c.rotation.set(-.5,.3,0);c4Hand.add(c);
 const det=new THREE.Mesh(new THREE.BoxGeometry(.05,.1,.03),M.dark);det.position.set(-.3,-.02,.05);c4Hand.add(det);
 const ant=new THREE.Mesh(new THREE.CylinderGeometry(.004,.004,.08),M.dark);ant.position.set(-.31,.07,.05);c4Hand.add(ant);
 const btn=new THREE.Mesh(new THREE.BoxGeometry(.02,.012,.02),new THREE.MeshStandardMaterial({color:0xaa0000}));btn.position.set(-.3,.035,.05);c4Hand.add(btn);}
c4Hand.position.set(.2,-.22,-.45); c4Hand.visible=false; camera.add(c4Hand);

// tracers
const tracers=[];
for(let i=0;i<8;i++){const g=new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffd890,transparent:true,blending:THREE.AdditiveBlending,fog:false,depthWrite:false}));
  l.frustumCulled=false;l.visible=false;scene.add(l);tracers.push({l,life:0});}
let trI=0;
function tracer(a,b){const t=tracers[trI++%tracers.length];const p=t.l.geometry.attributes.position;p.setXYZ(0,a.x,a.y,a.z);p.setXYZ(1,b.x,b.y,b.z);p.needsUpdate=true;t.life=.06;t.l.visible=true;}

// =====================================================================
// PLAYER & INPUT
// =====================================================================
const player={pos:V(0,0,22),vel:V(),yaw:0,pitch:0,onGround:true,R:.35,H:1.7};
const keys={},mb={};
let locked=false,weapon=0,ads=0,fireCD=0,kick=0,draw=1,flashT=0;
const $=id=>document.getElementById(id);
const startEl=$('start'),scopeEl=$('scope'),crossEl=$('cross'),flashEl=$('flash'),weapEl=$('weap');
startEl.addEventListener('click',()=>{initAudio();renderer.domElement.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;startEl.style.display=locked?'none':'flex';if(!locked){mb[0]=mb[2]=false;}});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();
  if(e.code==='Digit1')setWeapon(0); if(e.code==='Digit2')setWeapon(1); if(e.code==='KeyQ')setWeapon(1-weapon);
  if(e.code==='KeyF'&&locked)detonateAll();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousedown',e=>{if(!locked)return;mb[e.button]=true;
  if(weapon===1&&e.button===0)placeC4(); if(weapon===1&&e.button===2)detonateAll();});
addEventListener('mouseup',e=>mb[e.button]=false);
addEventListener('wheel',()=>{if(locked)setWeapon(1-weapon);});
addEventListener('mousemove',e=>{
  if(!locked)return;
  const sens=.0022*camera.fov/72;
  player.yaw-=e.movementX*sens; player.pitch-=e.movementY*sens;
  player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch));
});
function setWeapon(w){if(w===weapon)return;weapon=w;draw=0;}

function shoot(){
  sfx.gun();
  const o=camera.getWorldPosition(V()),d=camera.getWorldDirection(V());
  const moving=Math.hypot(player.vel.x,player.vel.z)/6;
  const spread=(ads>.9?.0004:.012)+moving*.012*(1-ads);
  d.add(V(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(spread)).normalize();
  const h=rayWorld(o,d,400);
  const from=ads>.9?o.clone().add(V(0,-.08,0)):gun.localToWorld(V(0,.015,-.68));
  tracer(from,h?h.p:o.clone().addScaledVector(d,400));
  player.pitch+=ads>.9?.004:.012; player.yaw+=rnd(-.004,.004);
  kick=1; flashT=.05;
  if(!h) return;
  if(h.type==='c4'){detonate(h.c);return;}
  const p=h.p.clone().addScaledVector(h.n,.02);
  if(h.type==='ground'){
    spawnSprite({type:'smoke',pos:p,vel:V(0,1,0),life:.8,s0:.3,s1:1.1,op:.6,c0:new THREE.Color(.4,.34,.25),c1:new THREE.Color(.5,.45,.38),fadeIn:.02});
    for(let i=0;i<3;i++)spawnDebris('cube','dirt',V(.05,.05,.05),p,new THREE.Quaternion(),h.n.clone().multiplyScalar(rnd(2,4)).add(rdir().multiplyScalar(1.5)));
    sfx.impact('dirt',p); return;
  }
  const b=h.b,mat=b.mat;
  sfx.impact(mat,p);
  const nsp={rust:14,stone:8,concrete:6,wood:2,bark:2,roof:3,dark:10}[mat]||0;
  for(let i=0;i<nsp;i++)spark(p,h.n.clone().multiplyScalar(rnd(2,6)).add(rdir().multiplyScalar(3)),rnd(.15,.4));
  const dc={concrete:[.55,.53,.5],stone:[.5,.47,.42],wood:[.45,.33,.2],bark:[.3,.22,.14],leaf:[.2,.35,.15],roof:[.35,.2,.15],rust:[.45,.3,.15]}[mat]||[.4,.4,.4];
  spawnSprite({type:'smoke',pos:p,vel:h.n.clone().multiplyScalar(1.2),life:rnd(.7,1.2),s0:.3,s1:1.2,op:.7,drag:2,c0:new THREE.Color(...dc),c1:new THREE.Color(...dc).multiplyScalar(1.2),fadeIn:.02});
  for(let i=0;i<2;i++){const s=rnd(.05,.12);spawnDebris('cube',mat,V(s,s,s),p,new THREE.Quaternion(),h.n.clone().multiplyScalar(rnd(2,5)).add(rdir().multiplyScalar(1.5)));}
  b.hp-=34; tintBlock(b,.94);
  if(b.hp<=0){
    hideBlock(b);
    for(let i=0;i<3;i++)spawnDebris(b.geom,b.mat,b.scale.clone().multiplyScalar(.45),b.pos.clone().add(rdir().multiplyScalar(.15)),b.quat,d.clone().multiplyScalar(rnd(2,5)).add(rdir().multiplyScalar(2)));
    spawnSprite({type:'smoke',pos:b.pos.clone(),vel:V(0,.5,0),life:2,s0:1,s1:2.6,op:.6,c0:new THREE.Color(...dc),c1:new THREE.Color(...dc),fadeIn:.05});
    supportCheck();
  }
}

// collision against blocks (via grid) + map boundary
const pbox=new THREE.Box3();
function hits(p){
  pbox.min.set(p.x-player.R,p.y+.05,p.z-player.R); pbox.max.set(p.x+player.R,p.y+player.H,p.z+player.R);
  for(const b of query(pbox.min.x,pbox.min.z,pbox.max.x,pbox.max.z)) if(b.alive&&b.col&&b.box.intersectsBox(pbox)) return b.box;
  for(const c of staticColliders) if(c.intersectsBox(pbox)) return c;
  return null;
}
function moveAxis(axis,d){
  if(!d)return;
  const p=player.pos; p[axis]+=d;
  const c=hits(p);
  if(c){
    const step=c.max.y-p.y;
    if(step>0&&step<=.6&&player.onGround){const oy=p.y;p.y=c.max.y+.001;if(!hits(p))return;p.y=oy;}
    p[axis]-=d;
  }
}
function groundHeight(p){
  let gy=0;
  for(const b of query(p.x-player.R,p.z-player.R,p.x+player.R,p.z+player.R)){
    if(!b.alive||!b.col) continue; const c=b.box;
    if(p.x+player.R>c.min.x&&p.x-player.R<c.max.x&&p.z+player.R>c.min.z&&p.z-player.R<c.max.z&&c.max.y<=p.y+.6&&c.max.y>gy) gy=c.max.y;
  }
  return gy;
}

// =====================================================================
// LOOP
// =====================================================================
const clock=new THREE.Clock(); let bob=0,time=0,burnT=0;
const fwd=V(),right=V(),wish=V();
supportCheck();
function tick(){
  const dt=Math.min(clock.getDelta(),.05); time+=dt;
  // movement
  const speed=(keys.ShiftLeft||keys.ShiftRight)&&ads<.5?8.5:ads>.5?3:5;
  fwd.set(-Math.sin(player.yaw),0,-Math.cos(player.yaw)); right.set(-fwd.z,0,fwd.x);
  wish.set(0,0,0);
  if(locked){if(keys.KeyW)wish.add(fwd); if(keys.KeyS)wish.sub(fwd); if(keys.KeyD)wish.add(right); if(keys.KeyA)wish.sub(right);}
  if(wish.lengthSq())wish.normalize().multiplyScalar(speed);
  const k=player.onGround?12:2;
  player.vel.x+=(wish.x-player.vel.x)*Math.min(1,k*dt); player.vel.z+=(wish.z-player.vel.z)*Math.min(1,k*dt);
  if(keys.Space&&player.onGround&&locked){player.vel.y=6;player.onGround=false;}
  player.vel.y-=18*dt;
  moveAxis('x',player.vel.x*dt); moveAxis('z',player.vel.z*dt);
  const gy=groundHeight(player.pos);
  player.pos.y+=player.vel.y*dt;
  if(player.vel.y>0&&hits(player.pos)){player.pos.y-=player.vel.y*dt;player.vel.y=0;}
  if(player.pos.y<=gy){player.pos.y=gy;player.vel.y=0;player.onGround=true;} else if(player.pos.y>gy+.05) player.onGround=false;

  // weapons
  draw=Math.min(1,draw+dt*4);
  gun.visible=weapon===0; c4Hand.visible=weapon===1;
  const adsT=weapon===0&&mb[2]&&locked?1:0;
  ads+=(adsT-ads)*Math.min(1,dt*12);
  fireCD-=dt;
  if(weapon===0&&mb[0]&&locked&&fireCD<=0&&draw>.8){fireCD=.1;shoot();}
  kick*=Math.exp(-dt*14);
  flashT-=dt; muzzle.visible=flashT>0&&ads<.9; if(muzzle.visible){muzzle.material.rotation=rnd(0,7);muzzle.scale.setScalar(rnd(.25,.4));}
  muzzleLight.intensity=flashT>0?25:0;
  const hs=Math.hypot(player.vel.x,player.vel.z);
  bob+=hs*dt*1.6;
  const bm=Math.min(1,hs/5)*(1-ads);
  gun.position.lerpVectors(HIP,ADS,ads);
  gun.position.x+=Math.cos(bob)*.012*bm; gun.position.y+=Math.abs(Math.sin(bob))*.012*bm-(1-draw)*.35;
  gun.position.z+=kick*.06*(1-ads*.7); gun.rotation.x=kick*.08*(1-ads);
  c4Hand.position.set(.2+Math.cos(bob)*.012*bm,-.22-(1-draw)*.35,-.45);
  c4Hand.position.z+=(-.45-c4Hand.position.z)*.2;
  const scoped=ads>.9;
  scopeEl.style.opacity=scoped?1:0; if(scoped) gun.visible=false;
  crossEl.style.display=scoped||weapon===1&&false?'none':'block';
  camera.fov=72+(16-72)*ads*ads; camera.updateProjectionMatrix();
  weapEl.textContent=weapon===0?'۱ تفنگ  ·  ۲ C4':`C4 کار گذاشته: ${c4s.length}/8  ·  F انفجار`;

  // c4 blink & falling
  ledMat.emissiveIntensity=(time%.8)<.12?4:0;
  for(const c of c4s) if(c.fall){c.vy-=20*dt;c.m.position.y+=c.vy*dt;const fl=floorAt(c.m.position.x,c.m.position.z,c.m.position.y+.1);
    if(c.m.position.y<fl+.04){c.m.position.y=fl+.04;c.fall=false;c.vy=0;c.m.rotation.set(-Math.PI/2,0,0);}}

  // timers
  for(const t of [...timers]){t.t-=dt;if(t.t<=0){timers.splice(timers.indexOf(t),1);t.fn();}}

  // fx
  updateSprites(dt); updateSparks(dt); updateDebris(dt); updateFires(dt);
  for(const t of tracers){t.life-=dt;t.l.visible=t.life>0;t.l.material.opacity=Math.max(0,t.life/.06);}
  flashI*=Math.exp(-dt*9); flashLight.intensity=flashI<1?0:flashI;
  if(fires.length){const c=V();for(const f of fires)c.add(f.pos);c.divideScalar(fires.length);fireLight.position.copy(c).y+=1.5;
    fireLight.intensity=Math.min(fires.length,14)*14*(.75+.25*Math.sin(time*23)*Math.sin(time*7.3));}else fireLight.intensity=0;
  screenFlash*=Math.exp(-dt*7); flashEl.style.opacity=screenFlash.toFixed(3);
  burnT-=dt;
  if(burnT<=0){burnT=.15;
    if(burnDirty){burnTex.needsUpdate=true;burnDirty=false;}
    if(emberActive>0){emberActive-=.15;ectx.fillStyle='rgba(0,0,0,.035)';ectx.fillRect(0,0,512,512);emberDirty=true;}
    if(emberDirty){emberTex.needsUpdate=true;emberDirty=false;}}

  // camera + shake
  shake*=Math.exp(-dt*5);
  const sx=shake*shake;
  const sway=scoped?.0015:0;
  camera.position.set(player.pos.x+rnd(-1,1)*sx*.1,player.pos.y+1.6+(player.onGround?Math.sin(bob*2)*.04*bm:0)+rnd(-1,1)*sx*.1,player.pos.z+rnd(-1,1)*sx*.1);
  camera.rotation.set(player.pitch+rnd(-1,1)*sx*.02+Math.sin(time*1.3)*sway,player.yaw+rnd(-1,1)*sx*.02+Math.sin(time*.9)*sway,rnd(-1,1)*sx*.015,'YXZ');

  sun.target.position.set(player.pos.x,0,player.pos.z);
  sun.position.set(player.pos.x-70,26,player.pos.z+50);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.__game={explode,player,blocks,debris,c4s,placeC4,detonateAll,setWeapon,camera};
</script>
