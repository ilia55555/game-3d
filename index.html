// ---------- procedural textures ----------
function canvasTex(size, draw, repeat=1){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'); draw(g,size);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat,repeat);

}
const rnd=(a,b)=>a+Math.random()*(b-a);
function noise(g,s,base,n,var_,sz=[1,4]){
  g.fillStyle=base; g.fillRect(0,0,s,s);
  for(let i=0;i<n;i++){const v=rnd(-var_,var_);g.fillStyle=`rgba(${v>0?255:0},${v>0?255:0},${v>0?255:0},${Math.abs(v)})`;const w=rnd(...sz);g.fillRect(rnd(0,s),rnd(0,s),w,w);}
}
const texGrass=canvasTex(256,(g,s)=>{noise(g,s,'#5d6b34',9000,0.12);for(let i=0;i<40;i++){g.fillStyle=`rgba(110,90,50,${rnd(.1,.3)})`;g.beginPath();g.arc(rnd(0,s),rnd(0,s),rnd(6,20),0,7);g.fill();}},60);
const texConcrete=canvasTex(256,(g,s)=>{noise(g,s,'#8a867d',7000,0.1);g.strokeStyle='rgba(40,35,30,.5)';for(let i=0;i<6;i++){g.beginPath();let x=rnd(0,s),y=rnd(0,s);g.moveTo(x,y);for(let k=0;k<6;k++){x+=rnd(-20,20);y+=rnd(5,25);g.lineTo(x,y);}g.stroke();}for(let i=0;i<10;i++){g.fillStyle=`rgba(50,60,30,${rnd(.1,.25)})`;g.fillRect(rnd(0,s),s-rnd(0,60),rnd(10,60),rnd(10,60));}});
const texStone=canvasTex(256,(g,s)=>{g.fillStyle='#4a463f';g.fillRect(0,0,s,s);const h=32;for(let r=0;r<s/h;r++){const off=(r%2)*24;for(let x=-off;x<s;x+=48){const l=rnd(95,140);g.fillStyle=`rgb(${l},${l-5},${l-14})`;g.fillRect(x+2,r*h+2,44,h-4);}}noise(g,s,'rgba(0,0,0,0)',3000,0.12);});
const texWood=canvasTex(256,(g,s)=>{for(let x=0;x<s;x+=32){const l=rnd(70,100);g.fillStyle=`rgb(${l+30},${l},${l-30})`;g.fillRect(x,0,32,s);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(x,0,2,s);for(let i=0;i<30;i++){g.fillStyle=`rgba(40,25,10,${rnd(.1,.3)})`;g.fillRect(x+rnd(2,30),rnd(0,s),1,rnd(10,60));}}});
const texRust=canvasTex(256,(g,s)=>{noise(g,s,'#b8862a',6000,0.15);for(let i=0;i<60;i++){g.fillStyle=`rgba(${rnd(90,140)},${rnd(40,60)},20,${rnd(.2,.6)})`;g.beginPath();g.arc(rnd(0,s),rnd(0,s),rnd(3,18),0,7);g.fill();}});
const texBark=canvasTex(128,(g,s)=>{g.fillStyle='#3b2b1c';g.fillRect(0,0,s,s);for(let i=0;i<200;i++){g.fillStyle=`rgba(${rnd(60,100)},${rnd(45,70)},30,.6)`;g.fillRect(rnd(0,s),rnd(0,s),rnd(1,3),rnd(8,30));}});
const texLeaf=canvasTex(128,(g,s)=>{noise(g,s,'#2f4a22',3000,0.18,[2,6]);});
const texRoof=canvasTex(128,(g,s)=>{g.fillStyle='#4a2b20';g.fillRect(0,0,s,s);for(let y=0;y<s;y+=12)for(let x=(y/12%2)*8;x<s;x+=16){const l=rnd(60,90);g.fillStyle=`rgb(${l},${l*.55},${l*.4})`;g.fillRect(x+1,y+1,14,10);}});

const M = {
  concrete:new THREE.MeshStandardMaterial({map:texConcrete,roughness:.95}),
  stone:new THREE.MeshStandardMaterial({map:texStone,roughness:.9}),
  wood:new THREE.MeshStandardMaterial({map:texWood,roughness:.85}),
  rust:new THREE.MeshStandardMaterial({map:texRust,roughness:.7,metalness:.4}),
  bark:new THREE.MeshStandardMaterial({map:texBark,roughness:1}),
  leaf:new THREE.MeshStandardMaterial({map:texLeaf,roughness:.9,flatShading:true}),

  dirt:new THREE.MeshStandardMaterial({color:0x4a3a28,roughness:1}),

function blockTex(r,g,b){return canvasTex(128,(c,s)=>{
  c.fillStyle=`rgb(${r},${g},${b})`;c.fillRect(0,0,s,s);
  for(let i=0;i<2500;i++){const v=rnd(-.13,.13);c.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;c.fillRect(rnd(0,s),rnd(0,s),rnd(1,3),rnd(1,3));}
  for(let i=0;i<5;i++){c.fillStyle=`rgba(0,0,0,${rnd(.05,.12)})`;c.beginPath();c.arc(rnd(0,s),rnd(0,s),rnd(6,18),0,7);c.fill();}
  c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=6;c.strokeRect(0,0,s,s);
  c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=2;c.beginPath();c.moveTo(4,s-4);c.lineTo(4,4);c.lineTo(s-4,4);c.stroke();});}
const texPlank=canvasTex(128,(c,s)=>{c.fillStyle='#7a5636';c.fillRect(0,0,s,s);
  for(let i=0;i<70;i++){c.strokeStyle=`rgba(${rnd(30,60)|0},${rnd(18,35)|0},8,${rnd(.15,.4)})`;c.lineWidth=rnd(.5,2);const y=rnd(0,s);c.beginPath();c.moveTo(0,y);c.bezierCurveTo(s*.3,y+rnd(-4,4),s*.6,y+rnd(-4,4),s,y+rnd(-3,3));c.stroke();}
  c.fillStyle='rgba(40,22,8,.6)';for(let i=0;i<2;i++){c.beginPath();c.ellipse(rnd(10,s-10),rnd(10,s-10),rnd(3,6),rnd(2,3),0,0,7);c.fill();}
  c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=3;c.strokeRect(0,0,s,s);});
M.sblock=new THREE.MeshStandardMaterial({map:blockTex(128,120,106),roughness:.92});
M.cblock=new THREE.MeshStandardMaterial({map:blockTex(140,136,128),roughness:.95});
M.plank=new THREE.MeshStandardMaterial({map:texPlank,roughness:.8});

const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const rdir=()=>V(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize();

// =====================================================================
// RIGID BODIES — every world piece is an oriented box body
//   static : part of the intact world (immovable until woken)
//   active : simulated
//   sleep  : came to rest; immovable again until something disturbs it
// =====================================================================
const G={cube:new THREE.BoxGeometry(1,1,1),cyl:new THREE.CylinderGeometry(.5,.5,1,12),cone8:new THREE.ConeGeometry(.5,1,8),cone4:new THREE.ConeGeometry(.5,1,4),ico:new THREE.IcosahedronGeometry(.5,0)};
const DENS={sblock:2.4,cblock:2.1,stone:2.4,plank:.6,wood:.6,roof:.6,rust:3,bark:.8,leaf:.25,dark:3,concrete:2.2};
const HP={sblock:130,cblock:100,stone:130,plank:40,wood:50,roof:40,rust:70,bark:60,leaf:15,dark:20,concrete:90};
const blocks=[];
const SIGNS=[];
for(const x of [-1,1])for(const y of [-1,1])for(const z of [-1,1])SIGNS.push([x,y,z]);
for(const a of [-1,1])for(const b of [-1,1]){SIGNS.push([0,a,b]);SIGNS.push([a,0,b]);SIGNS.push([a,b,0]);}
let groupN=0;
function addBlock(geom,mat,sx,sy,sz,x,y,z,rot=null,col=true,opt={}){
  const quat=new THREE.Quaternion(); if(rot) quat.setFromEuler(new THREE.Euler(rot[0],rot[1],rot[2]));
  const hf=geom==='cube'?[.5,.5,.5]:geom==='cyl'?[.45,.5,.45]:[.34,.4,.34];
  const h=V(sx*hf[0],sy*hf[1],sz*hf[2]);
  const mass=8*h.x*h.y*h.z*(DENS[mat]||1);
  const pts=[];
  for(const s of SIGNS) pts.push(s[0]*h.x,s[1]*h.y,s[2]*h.z);
  const hv=[h.x,h.y,h.z];
  for(let a=0;a<3;a++) if(hv[a]>.7){const n=Math.min(6,Math.floor(hv[a]/.6));
    for(let k=1;k<=n;k++){const f=(k/(n+1))*2-1;for(const u of [-1,1])for(const v of [-1,1]){const p=[0,0,0];p[a]=f*hv[a];p[(a+1)%3]=u*hv[(a+1)%3];p[(a+2)%3]=v*hv[(a+2)%3];pts.push(...p);}}}
  const b={id:blocks.length,geom,mat,pos:V(x,y,z),quat,scale:V(sx,sy,sz),h,mass,invM:1/mass,
    invI:V(3/(mass*(h.y*h.y+h.z*h.z)),3/(mass*(h.x*h.x+h.z*h.z)),3/(mass*(h.x*h.x+h.y*h.y))),
    pts:new Float32Array(pts),ax:[V(),V(),V()],box:new THREE.Box3(),col,hp:HP[mat]||60,alive:true,
    color:new THREE.Color().setScalar(rnd(.8,1.05)),im:null,idx:0,stamp:0,cells:[],
    state:'static',v:V(),w:V(),sleepT:0,life:0,startPos:V(),wokeAbove:false,burn:0,emit:0,
    orig:V(x,y,z),parent:opt.parent||null,kids:null,lp:null,lq:null,group:opt.group||0,noSelf:!!opt.noSelf,hang:!!opt.hang};
  updateFrame(b); blocks.push(b);
  if(b.parent){const P=b.parent;(P.kids??=[]).push(b);const iq=P.quat.clone().invert();b.lp=b.pos.clone().sub(P.pos).applyQuaternion(iq);b.lq=iq.multiply(b.quat);b.state='attached';}
  return b;
}
function updateFrame(b){
  const [a0,a1,a2]=b.ax; a0.set(1,0,0).applyQuaternion(b.quat); a1.set(0,1,0).applyQuaternion(b.quat); a2.set(0,0,1).applyQuaternion(b.quat);
  const h=b.h;
  const ex=Math.abs(a0.x)*h.x+Math.abs(a1.x)*h.y+Math.abs(a2.x)*h.z;
  const ey=Math.abs(a0.y)*h.x+Math.abs(a1.y)*h.y+Math.abs(a2.y)*h.z;
  const ez=Math.abs(a0.z)*h.x+Math.abs(a1.z)*h.y+Math.abs(a2.z)*h.z;
  b.box.min.set(b.pos.x-ex,b.pos.y-ey,b.pos.z-ez); b.box.max.set(b.pos.x+ex,b.pos.y+ey,b.pos.z+ez);
}
// legacy helper: unrotated boxes split into ~1m pieces (crane), rotated = one piece
function box(w,h,d,x,y,z,mat,{col=true,ry=0,rot=null,group=0,noSelf=false,hang=false}={}){
  const opt={group,noSelf,hang};
  if(ry) rot=[0,ry,0];
  if(rot){addBlock('cube',mat,w,h,d,x,y,z,rot,col,opt);return;}
  const nx=Math.max(1,Math.round(w)),ny=Math.max(1,Math.round(h)),nz=Math.max(1,Math.round(d));
  const cw=w/nx,ch=h/ny,cd=d/nz;
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)for(let k=0;k<nz;k++)
    addBlock('cube',mat,cw,ch,cd,x-w/2+(i+.5)*cw,y-h/2+(j+.5)*ch,z-d/2+(k+.5)*cd,null,col,opt);
}
// running-bond masonry wall along +x or +z, with openings and optional broken top
function wall({x0,z0,x1,z1,y0,h,t,mat,L=1.2,bh=.5,open=[],top=null,ph=0}){
  const alongX=x1!==x0, len=alongX?x1-x0:z1-z0;
  const rows=Math.max(1,Math.round(h/bh)), rh=h/rows;
  const snap=y=>y0+Math.round((y-y0)/rh)*rh;
  const ops=open.map(o=>({a:o.a,b:o.b,y0:snap(o.y0),y1:snap(o.y1)}));
  for(let r=0;r<rows;r++){
    const yb=y0+r*rh, off=((r+ph)%2)*L/2;
    const cut=[...ops];
    for(const o of ops) if(Math.abs(yb-o.y1)<1e-6&&o.y1>o.y0){ // timber lintel over the opening
      const a=Math.max(0,o.a-.6),b=Math.min(len,o.b+.6),m=(a+b)/2;
      if(alongX) addBlock('cube','plank',b-a-.004,rh-.004,t,x0+m,yb+rh/2,z0); else addBlock('cube','plank',t,rh-.004,b-a-.004,x0,yb+rh/2,z0+m);
      cut.push({a,b,y0:yb,y1:yb+rh});
    }
    for(let s=-off;s<len;s+=L){
      let segs=[[Math.max(0,s),Math.min(len,s+L)]];
      for(const o of cut){
        if(!(o.y0<yb+rh-1e-6&&o.y1>yb+1e-6)) continue;
        const ns=[];
        for(const [a,b] of segs){ if(o.b<=a||o.a>=b){ns.push([a,b]);continue;} if(o.a>a)ns.push([a,o.a]); if(o.b<b)ns.push([o.b,b]); }
        segs=ns;
      }
      for(const [a,b] of segs){
        if(b-a<.15) continue;
        const m=(a+b)/2; if(top&&yb+rh>top(m)+1e-6) continue;
        if(alongX) addBlock('cube',mat,b-a-.004,rh-.003,t,x0+m,yb+rh/2,z0);
        else addBlock('cube',mat,t,rh-.003,b-a-.004,x0,yb+rh/2,z0+m);
      }
    }
  }
}
const staticColliders=[];

// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({map:texGrass,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// burn overlay (scorched grass) + glowing embers
const burnCv=document.createElement('canvas'); burnCv.width=burnCv.height=1024;
const bctx=burnCv.getContext('2d');
const emberCv=document.createElement('canvas'); emberCv.width=emberCv.height=512;
const ectx=emberCv.getContext('2d'); ectx.fillStyle='#000'; ectx.fillRect(0,0,512,512);

const emberTex=new THREE.CanvasTexture(emberCv); emberTex.colorSpace=THREE.SRGBColorSpace;
const burnPlane=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({map:burnTex,emissive:0xffffff,emissiveMap:emberTex,emissiveIntensity:2.5,transparent:true,depthWrite:false,roughness:1,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));
burnPlane.rotation.x=-Math.PI/2; burnPlane.position.y=.01; burnPlane.receiveShadow=true; scene.add(burnPlane);
let burnDirty=false,emberDirty=false,emberActive=0;
function scorch(x,z,r,a){
  const px=(x+100)*5.12,py=(z+100)*5.12,pr=r*5.12;
  for(let i=0;i<5;i++){
    const ox=px+rnd(-.35,.35)*pr,oy=py+rnd(-.35,.35)*pr,rr=pr*rnd(.55,1);
    const g=bctx.createRadialGradient(ox,oy,0,ox,oy,rr);
    g.addColorStop(0,`rgba(10,8,6,${a})`); g.addColorStop(.55,`rgba(22,16,10,${a*.75})`); g.addColorStop(1,'rgba(40,28,15,0)');
    bctx.fillStyle=g; bctx.beginPath(); bctx.arc(ox,oy,rr,0,7); bctx.fill();
  }

    bctx.fillStyle=`rgba(${rnd(70,120)|0},${rnd(65,110)|0},${rnd(60,100)|0},${rnd(.15,.45)*a})`;
    bctx.fillRect(px+Math.cos(an)*d,py+Math.sin(an)*d,rnd(1,2.5),rnd(1,2.5));}
  burnDirty=true;
}
function embers(x,z,r){
  const px=(x+100)*2.56,py=(z+100)*2.56,pr=r*2.56;
  for(let i=0;i<pr*6;i++){const an=rnd(0,7),d=Math.sqrt(Math.random())*pr;
    ectx.fillStyle=`rgb(255,${rnd(60,150)|0},${rnd(0,30)|0})`;
    ectx.fillRect(px+Math.cos(an)*d,py+Math.sin(an)*d,rnd(.6,2),rnd(.6,2));}

}

// WORLD — masonry & plank construction

// ---------- abandoned building (center): concrete blocks + timber floors ----------
(function(){
  const H=3.4,F2=H+.3,T2=F2+3.4,t=.4,M_='cblock';
  // floor 1
  wall({x0:-8.2,z0:6,x1:8.2,z1:6,y0:0,h:H,t,mat:M_,open:[{a:7,b:9.4,y0:0,y1:2.6}]});
  wall({x0:-8.2,z0:-6,x1:8.2,z1:-6,y0:0,h:H,t,mat:M_,ph:1});
  for(const s of [-1,1]) wall({x0:8*s,z0:-5.8,x1:8*s,z1:5.8,y0:0,h:H,t,mat:M_,ph:1,open:[{a:3.8,b:7.8,y0:1,y1:2.8}]});
  // floor joists + planks (stair hole at x<-3, z<-2)
  for(const x of [-8,-3,1,5,8]) addBlock('cube','plank',.2,.2,12.4,x,H+.1,0);
  const rows=25,rw=12.4/rows;
  for(let k=0;k<rows;k++){
    const zc=-6.2+(k+.5)*rw;
    for(const [a,b] of [[-8.2,-3],[-3,1],[1,5],[5,8.2]]){
      if(a<-8&&zc>-5.7&&zc<-2){addBlock('cube','plank',.5,.1,rw-.005,-7.95,H+.25,zc);continue;}
      addBlock('cube','plank',b-a-.005,.1,rw-.005,(a+b)/2,H+.25,zc);
    }
  }
  // floor 2

let AC=null,master,revIn,noiseBuf;
function initAudio(){
  if(AC){AC.resume();return;}
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=8; comp.connect(AC.destination);
  master=AC.createGain(); master.gain.value=.85; master.connect(comp);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  // impulse response: early reflections + diffuse decaying tail
  const len=AC.sampleRate*3,ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const o=ir.getChannelData(ch);let lp=0;
    for(let i=0;i<len;i++){const t=i/len;lp=lp*.55+(Math.random()*2-1)*.45;o[i]=i<AC.sampleRate*.015?0:lp*Math.pow(1-t,3.4);}
    for(let k=0;k<8;k++){const at=Math.floor(AC.sampleRate*rnd(.03,.25));o[at]+=rnd(.3,.7)*(Math.random()<.5?-1:1);}}
  const conv=AC.createConvolver(); conv.buffer=ir;
  revIn=AC.createGain(); const rg=AC.createGain(); rg.gain.value=.5;
  revIn.connect(conv); conv.connect(rg); rg.connect(comp);
}
function bus(p,wet,ref=4){
  const g=AC.createGain(); let out=g;
  if(p){const pn=AC.createPanner(); pn.panningModel='HRTF'; pn.distanceModel='inverse'; pn.refDistance=ref; pn.rolloffFactor=1; pn.maxDistance=500;
    if(pn.positionX){pn.positionX.value=p.x;pn.positionY.value=p.y;pn.positionZ.value=p.z;}else pn.setPosition(p.x,p.y,p.z);
    g.connect(pn); out=pn;}
  out.connect(master); const s=AC.createGain(); s.gain.value=wet; out.connect(s); s.connect(revIn);
  return g;
}
function nz(dst,t0,dur,type,f0,f1,q,peak,att=.002){
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(f0,t0); if(f1) f.frequency.exponentialRampToValueAtTime(f1,t0+dur); f.Q.value=q;
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t0+att); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(dst); s.start(t0,Math.random()*1.5); s.stop(t0+dur+.05);
}
function tone(dst,t0,dur,type,f0,f1,peak,att=.003){
  const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t0); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t0+att); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(dst); o.start(t0); o.stop(t0+dur+.05);
}

const c4s=[];const timers=[];
const c4Mat=new THREE.MeshStandardMaterial({color:0x6e6b48,roughness:.8});
const ledMat=new THREE.MeshStandardMaterial({color:0x330000,emissive:0xff0000,emissiveIntensity:0});
function makeC4(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(.28,.17,.07),c4Mat); body.castShadow=true; g.add(body);
  const tape=new THREE.Mesh(new THREE.BoxGeometry(.29,.04,.075),M.dark); g.add(tape);
  const pad=new THREE.Mesh(new THREE.BoxGeometry(.08,.06,.02),M.dark); pad.position.set(.06,.03,.04); g.add(pad);
  const led=new THREE.Mesh(new THREE.SphereGeometry(.012,8,6),ledMat); led.position.set(.06,.03,.055); g.add(led);

}
const _iq=new THREE.Quaternion();
function placeC4(){
  if(c4s.length>=8) return;
  const o=camera.getWorldPosition(V()),d=camera.getWorldDirection(V());
  const h=rayWorld(o,d,5); if(!h||h.type==='c4') return;
  const m=makeC4(); m.position.copy(h.p).addScaledVector(h.n,.04); m.lookAt(m.position.clone().add(h.n));
  scene.add(m);
  const c={m,block:h.type==='block'?h.b:null,fall:false,vy:0};
  if(c.block){_iq.copy(c.block.quat).invert();c.lp=m.position.clone().sub(c.block.pos).applyQuaternion(_iq);c.lq=_iq.clone().multiply(m.quaternion);}
  c4s.push(c); sfx.place();
}
function detonate(c){const i=c4s.indexOf(c);if(i<0)return;c4s.splice(i,1);scene.remove(c.m);explode(c.m.position.clone(),5);}
function detonateAll(){if(!c4s.length)return;sfx.beep();[...c4s].forEach((c,i)=>timers.push({t:.25+i*.18,fn:()=>detonate(c)}));}
function shatter(b,pos){
  hideBlock(b);
  const n=b.mass>.3?3:2,s=Math.cbrt(b.scale.x*b.scale.y*b.scale.z);
  for(let k=0;k<n;k++){const dir=b.pos.clone().sub(pos).normalize().add(rdir().multiplyScalar(.6));dir.y+=rnd(.2,.8);
    spawnChip(b.mat,Math.min(.35,s*rnd(.2,.35)),b.pos.clone().add(rdir().multiplyScalar(.2)),dir.multiplyScalar(rnd(8,22)),Math.random()<.25?rnd(.6,1.6):0);}
}

// a masonry ring that loses enough of its base can't stand: it leans toward the breach and comes down
function checkTower(pos){
  if(TOWER.fallen||Math.hypot(pos.x-TOWER.c.x,pos.z-TOWER.c.z)>14||pos.y>12) return;
  let base=0,lost=0;
  for(let i=TOWER.start;i<TOWER.end;i++){const b=blocks[i];if(b.orig.y>4.5)continue;base++;
    if(!b.alive||b.pos.distanceToSquared(b.orig)>.04||b.state==='active')lost++;}
  if(lost/base<.16) return;
  TOWER.fallen=true;
  const dir=V(pos.x-TOWER.c.x,0,pos.z-TOWER.c.z); if(dir.lengthSq()<.01) dir.set(1,0,0); dir.normalize();
  // the base courses burst out; everything above loses its footing and comes down
  for(let i=TOWER.start;i<TOWER.end;i++){const b=blocks[i];
    if(!b.alive||b.orig.y>2.6) continue;
    const rad=V(b.pos.x-TOWER.c.x,0,b.pos.z-TOWER.c.z).normalize();
    // most of the base is pulverized; the rest is kicked out low so nothing is left to carry the load
    if(Math.random()<.7||!wake(b,true)){shatter(b,TOWER.c);if(Math.random()<.3)spawnSprite({type:'smoke',pos:b.pos.clone(),vel:rad.clone().multiplyScalar(rnd(2,5)),life:rnd(3,6),s0:2,s1:7,op:.7,drag:.8,lift:.2,c0:new THREE.Color(.5,.47,.42),c1:new THREE.Color(.62,.6,.56),fadeIn:.1});continue;}
    b.v.addScaledVector(rad,rnd(4,10)).addScaledVector(dir,rnd(0,3)); b.v.y-=1; b.w.add(rdir().multiplyScalar(rnd(2,6)));
  }
  // the cantilevered outer stair drops away
  for(let i=TOWER.start;i<TOWER.end;i++){const b=blocks[i];if(b.alive&&b.scale.x>1.7&&b.scale.y<.35&&wake(b,true)){b.v.add(V(b.pos.x-TOWER.c.x,0,b.pos.z-TOWER.c.z).normalize().multiplyScalar(rnd(.5,2)));b.w.add(rdir());}}
  // upper courses are loosened so they tumble instead of dropping as a unit
  for(let i=TOWER.start;i<TOWER.end;i++){const b=blocks[i];
    if(!b.alive||b.orig.y<=2.6) continue;
    const hy=b.orig.y/16;
    timers.push({t:.25+hy*.4,fn:()=>{if(!b.alive)return;b.v.addScaledVector(dir,rnd(.5,2.5)*hy).add(rdir().multiplyScalar(.5));b.w.add(rdir().multiplyScalar(rnd(.2,1)));wake(b,true);}});
  }
  sfx.rumble(TOWER.c.clone().add(V(0,8,0)));
}
const MASONRY=new Set(['sblock','cblock','plank','roof','wood','stone']);
function explode(pos,R){
  const d=distTo(pos);
  sfx.explosion(pos);
  flashLight.position.copy(pos).y+=1.5; flashI=6000;
  screenFlash=Math.max(screenFlash,.9*Math.max(0,1-d/90));
  shake=Math.min(1,shake+.9*Math.max(0,1-d/70));
  const nearGround=pos.y-floorAt(pos.x,pos.z,pos.y+.2)<2.5;
  shockwave(pos,R,nearGround&&pos.y<1.5);
  // fireball
  spawnSprite({type:'fire',pos,vel:V(),life:.3,s0:3,s1:R*3,op:1,c0:new THREE.Color(1,1,.9)});
  for(let i=0;i<40;i++){const dir=rdir();dir.y=Math.abs(dir.y)*.8+.15;
    spawnSprite({type:'fire',pos:pos.clone().addScaledVector(dir,rnd(0,1.2)),vel:dir.clone().multiplyScalar(rnd(3,11)),life:rnd(.5,1.3),s0:rnd(2,3.5),s1:rnd(4.5,7.5),op:1,drag:2.6,lift:3.5});}
  // smoke column: fire-lit at birth → sooty → sun-lit grey
  for(let i=0;i<38;i++){const dir=rdir();const g=rnd(.07,.16),hgt=Math.random();
    spawnSprite({type:'smoke',pos:pos.clone().addScaledVector(dir,rnd(0,1.5)).add(V(0,hgt*2,0)),vel:dir.multiplyScalar(rnd(1,5)).add(V(0,rnd(2,4.5)+hgt*2,0)),delay:rnd(.05,.6),life:rnd(6,11),
      s0:rnd(2.5,4),s1:rnd(9,17),op:.85,drag:.7,lift:.35,c0:new THREE.Color(.55,.28,.1),cm:new THREE.Color(g,g*.95,g*.9),c1:new THREE.Color(.58,.57,.55),fadeIn:.3});}
  for(let i=0;i<380;i++){const dir=rdir();dir.y=Math.abs(dir.y)*1.2-.1;spark(pos,dir.multiplyScalar(rnd(8,34)),rnd(.4,1.8));}
  if(nearGround){
    for(let i=0;i<22;i++){const a=rnd(0,7),dir=V(Math.cos(a),0,Math.sin(a));
      spawnSprite({type:'smoke',pos:pos.clone().add(V(0,.4,0)),vel:dir.multiplyScalar(rnd(10,18)).add(V(0,rnd(.3,1.5),0)),life:rnd(1.5,2.5),s0:1.5,s1:5,op:.6,drag:2.4,c0:new THREE.Color(.42,.36,.27),c1:new THREE.Color(.55,.5,.42),fadeIn:.05});}
    for(let i=0;i<24;i++){const dir=rdir();dir.y=Math.abs(dir.y)+.3;
      spawnChip('dirt',rnd(.1,.3),pos.clone().add(V(0,.3,0)),dir.multiplyScalar(rnd(6,18)),Math.random()<.2?rnd(.6,1.4):0);}
  }
  // pieces: shatter the core, fling everything else with physics
  const list=nearby(pos.x-R*3.4,pos.z-R*3.4,pos.x+R*3.4,pos.z+R*3.4)
    .map(b=>({b,dd:b.box.distanceToPoint(pos)})).filter(o=>o.b.alive&&o.dd<R*3.4).sort((a,b)=>a.dd-b.dd);
  for(const {b,dd} of list){
    if(!b.alive) continue;
    if(dd>R*1.8){ // shock wave loosens masonry further out: it becomes fully dynamic and settles or collapses on its own
      if(MASONRY.has(b.mat)&&b.state!=='active'&&wake(b)){const f=1-(dd-R*1.8)/(R*1.6);const dir=b.pos.clone().sub(pos);dir.y=0;dir.normalize();
        b.v.addScaledVector(dir,f*rnd(.4,1.6)/Math.cbrt(Math.max(.2,b.mass)));b.w.add(rdir().multiplyScalar(f*.4));}
      continue;}
    tintBlock(b,.35+.65*dd/(R*1.8));
    if(dd<R*.32*rnd(.7,1.3)||(b.mat==='leaf'&&dd<R*.8)){shatter(b,pos);continue;}
    if(dd<R*1.7){
      if(!wake(b,true)){if(dd<R)shatter(b,pos);continue;}
      const f=Math.pow(1-dd/(R*1.7),1.2);
      const dir=b.pos.clone().sub(pos); dir.y+=.6; dir.normalize();
      b.v.addScaledVector(dir,Math.min(32,f*24/Math.cbrt(Math.max(.05,b.mass))+rnd(0,2)));
      b.w.add(rdir().multiplyScalar(f*rnd(2,9)));
      if(Math.random()<.3*f) b.burn=rnd(1,3);
    }else if(b.mat==='leaf'&&Math.random()<.6) addFire(b.pos,1.3,rnd(4,9),rnd(0,1.5),b);
  }
  if(nearGround&&pos.y<1.5){
    scorch(pos.x,pos.z,R*.9,1); embers(pos.x,pos.z,R*.8);
    for(let i=0;i<18;i++){const a=rnd(0,7),r=rnd(1,R*1.7);const p=V(pos.x+Math.cos(a)*r,0,pos.z+Math.sin(a)*r);
      if(floorAt(p.x,p.z,.5)>.2) continue; p.y=.05;
      addFire(p,rnd(.8,1.6),rnd(4,10),r/R*1.3);}
  }
  checkTower(pos);
  for(const c of c4s) if(c.m.position.distanceTo(pos)<R*1.6) timers.push({t:rnd(.08,.22),fn:()=>detonate(c)});
  if(d<R*1.8){const k=(1-d/(R*1.8))*12;const dir=player.pos.clone().sub(pos);dir.y=0;dir.normalize();
    player.vel.addScaledVector(dir,k);player.vel.y+=k*.4;player.onGround=false;}
}

document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;startEl.style.display=locked?'none':'flex';if(!locked){mb[0]=mb[2]=false;}});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();
  if(e.code==='Digit1')setWeapon(0); if(e.code==='Digit2')setWeapon(1); if(e.code==='KeyQ')setWeapon(1-weapon);
  if(e.code==='KeyF'&&locked)detonateAll();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousedown',e=>{if(!locked)return;mb[e.button]=true;
  if(weapon===1&&e.button===0)placeC4(); if(weapon===1&&e.button===2)detonateAll();});
addEventListener('mouseup',e=>mb[e.button]=false);
addEventListener('wheel',()=>{if(locked)setWeapon(1-weapon);});
addEventListener('mousemove',e=>{
  if(!locked)return;
  const sens=.0022*camera.fov/72;
  player.yaw-=e.movementX*sens; player.pitch-=e.movementY*sens;
  player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch));
});
function setWeapon(w){if(w===weapon)return;weapon=w;draw=0;}

const DUST={cblock:[.55,.53,.5],concrete:[.55,.53,.5],sblock:[.5,.47,.42],stone:[.5,.47,.42],wood:[.45,.33,.2],plank:[.45,.33,.2],bark:[.3,.22,.14],leaf:[.2,.35,.15],roof:[.35,.2,.15],rust:[.45,.3,.15]};
function shoot(){
  sfx.gun();
  const o=camera.getWorldPosition(V()),d=camera.getWorldDirection(V());
  const moving=Math.hypot(player.vel.x,player.vel.z)/6;
  const spread=(ads>.9?.0004:.012)+moving*.012*(1-ads);
  d.add(V(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(spread)).normalize();
  const h=rayWorld(o,d,400);
  const from=ads>.9?o.clone().add(V(0,-.08,0)):gun.localToWorld(V(0,.015,-.68));
  tracer(from,h?h.p:o.clone().addScaledVector(d,400));
  player.pitch+=ads>.9?.004:.012; player.yaw+=rnd(-.004,.004);
  kick=1; flashT=.05;
  if(!h) return;
  if(h.type==='c4'){detonate(h.c);return;}
  const p=h.p.clone().addScaledVector(h.n,.02);
  if(h.type==='ground'){
    spawnSprite({type:'smoke',pos:p,vel:V(0,1,0),life:.8,s0:.3,s1:1.1,op:.6,c0:new THREE.Color(.4,.34,.25),c1:new THREE.Color(.5,.45,.38),fadeIn:.02});
    for(let i=0;i<3;i++)spawnChip('dirt',.05,p,h.n.clone().multiplyScalar(rnd(2,4)).add(rdir().multiplyScalar(1.5)));
    sfx.impact('dirt',p); return;
  }
  const b=h.b,mat=b.mat;
  sfx.impact(mat,p);
  const nsp={rust:14,sblock:8,stone:8,cblock:6,concrete:6,wood:2,plank:2,bark:2,roof:3,dark:10}[mat]||0;
  for(let i=0;i<nsp;i++)spark(p,h.n.clone().multiplyScalar(rnd(2,6)).add(rdir().multiplyScalar(3)),rnd(.15,.4));
  const dc=DUST[mat]||[.4,.4,.4];
  spawnSprite({type:'smoke',pos:p,vel:h.n.clone().multiplyScalar(1.2),life:rnd(.7,1.2),s0:.3,s1:1.2,op:.7,drag:2,c0:new THREE.Color(...dc),c1:new THREE.Color(...dc).multiplyScalar(1.2),fadeIn:.02});
  for(let i=0;i<2;i++)spawnChip(mat,rnd(.05,.12),p,h.n.clone().multiplyScalar(rnd(2,5)).add(rdir().multiplyScalar(1.5)));
  if(b.state==='active'){const imp=d.clone().multiplyScalar(4*Math.min(1,.2/b.mass)+.3);b.v.add(imp);_b.subVectors(p,b.pos).cross(imp);b.w.add(invIw(b,_b,_c).multiplyScalar(b.mass*.3));}
  b.hp-=34; tintBlock(b,.94);
  if(b.hp<=0){
    hideBlock(b);
    const s=Math.cbrt(b.scale.x*b.scale.y*b.scale.z);
    for(let i=0;i<3;i++)spawnChip(b.mat,Math.min(.3,s*.35),b.pos.clone().add(rdir().multiplyScalar(.15)),d.clone().multiplyScalar(rnd(2,5)).add(rdir().multiplyScalar(2)));
    spawnSprite({type:'smoke',pos:b.pos.clone(),vel:V(0,.5,0),life:2,s0:1,s1:2.6,op:.6,c0:new THREE.Color(...dc),c1:new THREE.Color(...dc),fadeIn:.05});
  }
}

// player collision against bodies (grid + active) + map boundary
const pbox=new THREE.Box3();
function hits(p){
  pbox.min.set(p.x-player.R,p.y+.05,p.z-player.R); pbox.max.set(p.x+player.R,p.y+player.H,p.z+player.R);
  for(const b of nearby(pbox.min.x,pbox.min.z,pbox.max.x,pbox.max.z)) if(b.alive&&b.col&&b.box.intersectsBox(pbox)) return b.box;
  for(const c of staticColliders) if(c.intersectsBox(pbox)) return c;
  return null;
}
function moveAxis(axis,d){
  if(!d)return;
  const p=player.pos; p[axis]+=d;
  const c=hits(p);
  if(c){
    const step=c.max.y-p.y;
    if(step>0&&step<=.6&&player.onGround){const oy=p.y;p.y=c.max.y+.001;if(!hits(p))return;p.y=oy;}
    p[axis]-=d;
  }
}
function groundHeight(p){
  let gy=0;
  for(const b of nearby(p.x-player.R,p.z-player.R,p.x+player.R,p.z+player.R)){
    if(!b.alive||!b.col) continue; const c=b.box;
    if(p.x+player.R>c.min.x&&p.x-player.R<c.max.x&&p.z+player.R>c.min.z&&p.z-player.R<c.max.z&&c.max.y<=p.y+.6&&c.max.y>gy) gy=c.max.y;
  }
  return gy;
}

// =====================================================================
// LOOP
// =====================================================================
const clock=new THREE.Clock(); let bob=0,time=0,burnT=0;
const fwd=V(),right=V(),wish=V(),_sd=V();
function tick(){
  const dt=Math.min(clock.getDelta(),.05); time+=dt;
  const speed=(keys.ShiftLeft||keys.ShiftRight)&&ads<.5?8.5:ads>.5?3:5;
  fwd.set(-Math.sin(player.yaw),0,-Math.cos(player.yaw)); right.set(-fwd.z,0,fwd.x);
  wish.set(0,0,0);
  if(locked){if(keys.KeyW)wish.add(fwd); if(keys.KeyS)wish.sub(fwd); if(keys.KeyD)wish.add(right); if(keys.KeyA)wish.sub(right);}
  if(wish.lengthSq())wish.normalize().multiplyScalar(speed);
  const k=player.onGround?12:2;
  player.vel.x+=(wish.x-player.vel.x)*Math.min(1,k*dt); player.vel.z+=(wish.z-player.vel.z)*Math.min(1,k*dt);
  if(keys.Space&&player.onGround&&locked){player.vel.y=6;player.onGround=false;}
  player.vel.y-=18*dt;
  moveAxis('x',player.vel.x*dt); moveAxis('z',player.vel.z*dt);
  const gy=groundHeight(player.pos);
  player.pos.y+=player.vel.y*dt;
  if(player.vel.y>0&&hits(player.pos)){player.pos.y-=player.vel.y*dt;player.vel.y=0;}
  if(player.pos.y<=gy){player.pos.y=gy;player.vel.y=0;player.onGround=true;} else if(player.pos.y>gy+.05) player.onGround=false;

  draw=Math.min(1,draw+dt*4);
  gun.visible=weapon===0; c4Hand.visible=weapon===1;
  const adsT=weapon===0&&mb[2]&&locked?1:0;
  ads+=(adsT-ads)*Math.min(1,dt*12);
  fireCD-=dt;
  if(weapon===0&&mb[0]&&locked&&fireCD<=0&&draw>.8){fireCD=.1;shoot();}
  kick*=Math.exp(-dt*14);
  flashT-=dt; muzzle.visible=flashT>0&&ads<.9; if(muzzle.visible){muzzle.material.rotation=rnd(0,7);muzzle.scale.setScalar(rnd(.25,.4));}
  muzzleLight.intensity=flashT>0?25:0;
  const hs=Math.hypot(player.vel.x,player.vel.z);
  bob+=hs*dt*1.6;
  const bm=Math.min(1,hs/5)*(1-ads);
  gun.position.lerpVectors(HIP,ADS,ads);
  gun.position.x+=Math.cos(bob)*.012*bm; gun.position.y+=Math.abs(Math.sin(bob))*.012*bm-(1-draw)*.35;
  gun.position.z+=kick*.06*(1-ads*.7); gun.rotation.x=kick*.08*(1-ads);
  c4Hand.position.set(.2+Math.cos(bob)*.012*bm,-.22-(1-draw)*.35,-.45);
  const scoped=ads>.9;
  scopeEl.style.opacity=scoped?1:0; if(scoped) gun.visible=false;
  crossEl.style.display=scoped?'none':'block';
  camera.fov=72+(16-72)*ads*ads; camera.updateProjectionMatrix();
  weapEl.textContent=weapon===0?'۱ تفنگ  ·  ۲ C4':`C4 کار گذاشته: ${c4s.length}/8  ·  F انفجار`;

  ledMat.emissiveIntensity=(time%.8)<.12?4:0;
  for(const c of c4s){
    if(c.block&&c.block.alive&&c.block.state==='active'){c.m.position.copy(c.lp).applyQuaternion(c.block.quat).add(c.block.pos);c.m.quaternion.copy(c.block.quat).multiply(c.lq);}
    if(c.fall){c.vy-=20*dt;c.m.position.y+=c.vy*dt;const fl=floorAt(c.m.position.x,c.m.position.z,c.m.position.y+.1);
      if(c.m.position.y<fl+.04){c.m.position.y=fl+.04;c.fall=false;c.vy=0;c.m.rotation.set(-Math.PI/2,0,0);}}
  }

  for(const t of [...timers]){t.t-=dt;if(t.t<=0){timers.splice(timers.indexOf(t),1);t.fn();}}

  physics(dt);
  // burning pieces
  for(const b of active) if(b.burn>0){b.burn-=dt;b.emit-=dt;if(b.emit<=0){b.emit=.04;flame(b.pos,.8);if(Math.random()<.25)smoke(b.pos,.7,rnd(1.5,3),.15);spark(b.pos,rdir().multiplyScalar(2),.4);}}

  camera.updateMatrixWorld();
  _sd.subVectors(sun.position,sun.target.position).normalize().transformDirection(camera.matrixWorldInverse);
  sunAng=Math.atan2(_sd.y,_sd.x);
  updateSprites(dt); updateSparks(dt); updateChips(dt); updateFires(dt); updateShocks(dt);
  for(const t of tracers){t.life-=dt;t.l.visible=t.life>0;t.l.material.opacity=Math.max(0,t.life/.06);}
  flashI*=Math.exp(-dt*9); flashLight.intensity=flashI<1?0:flashI;
  if(fires.length){const c=V();for(const f of fires)c.add(f.pos);c.divideScalar(fires.length);fireLight.position.copy(c).y+=1.5;
    fireLight.intensity=Math.min(fires.length,14)*14*(.75+.25*Math.sin(time*23)*Math.sin(time*7.3));}else fireLight.intensity=0;
  screenFlash*=Math.exp(-dt*7); flashEl.style.opacity=screenFlash.toFixed(3);
  burnT-=dt;
  if(burnT<=0){burnT=.15;
    if(burnDirty){burnTex.needsUpdate=true;burnDirty=false;}
    if(emberActive>0){emberActive-=.15;ectx.fillStyle='rgba(0,0,0,.035)';ectx.fillRect(0,0,512,512);emberDirty=true;}
    if(emberDirty){emberTex.needsUpdate=true;emberDirty=false;}}

  shake*=Math.exp(-dt*5);
  const sx=shake*shake;
  const sway=scoped?.0015:0;
  camera.position.set(player.pos.x+rnd(-1,1)*sx*.1,player.pos.y+1.6+(player.onGround?Math.sin(bob*2)*.04*bm:0)+rnd(-1,1)*sx*.1,player.pos.z+rnd(-1,1)*sx*.1);
  camera.rotation.set(player.pitch+rnd(-1,1)*sx*.02+Math.sin(time*1.3)*sway,player.yaw+rnd(-1,1)*sx*.02+Math.sin(time*.9)*sway,rnd(-1,1)*sx*.015,'YXZ');
  updateListener();

  sun.target.position.set(player.pos.x,0,player.pos.z);
  sun.position.set(player.pos.x-70,26,player.pos.z+50);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.__game={explode,player,blocks,active,pending,c4s,camera,V,physics,step};
</script>
