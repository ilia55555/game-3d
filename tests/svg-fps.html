<!DOCTYPE html>
<html lang="fa"><head><meta charset="utf-8"><title>SVG FPS Test</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif}svg{width:100vw;height:100vh;display:block}</style>
</head><body>
<svg id="s" viewBox="0 0 800 450" preserveAspectRatio="none">
 <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4a5a"/><stop offset="1" stop-color="#8a9aa0"/></linearGradient>
  <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5040"/><stop offset="1" stop-color="#2a2418"/></linearGradient>
 </defs>
 <rect width="800" height="225" fill="url(#sky)"/><rect y="225" width="800" height="225" fill="url(#gnd)"/>
 <g id="walls"></g><g id="enemy"></g>
 <g stroke="#0f0" stroke-width="2"><line x1="390" y1="225" x2="396" y2="225"/><line x1="404" y1="225" x2="410" y2="225"/><line x1="400" y1="215" x2="400" y2="221"/><line x1="400" y1="229" x2="400" y2="235"/></g>
 <g id="gun" transform="translate(0,0)">
  <circle id="flash" cx="560" cy="300" r="0" fill="#ffd34d" opacity=".9"/>
  <polygon points="520,330 600,300 620,320 560,450 470,450" fill="#2b2b2b"/>
  <rect x="545" y="292" width="70" height="16" fill="#111" transform="rotate(-20 580 300)"/>
  <polygon points="500,380 560,360 580,450 520,450" fill="#3d3a30"/>
  <rect x="560" y="340" width="18" height="50" fill="#1a1a1a" transform="rotate(15 569 365)"/>
 </g>
 <text id="hud" x="20" y="430" fill="#fff" font-size="18">HP 100 | Ammo 30</text>
 <text id="msg" x="400" y="120" fill="#f44" font-size="36" text-anchor="middle"></text>
</svg>
<script>
const M=["1111111111","1000000001","1001100001","1000000101","1000000001","1011000001","1000001001","1000000001","1111111111"];
const W=800,H=450,FOV=Math.PI/3,R=160;
let p={x:1.5,y:1.5,a:.6,hp:100},ammo=30,e={x:7.5,y:6.5,hp:3,cd:0,dead:false},keys={},flash=0,recoil=0;
const wall=(x,y)=>M[Math.floor(y)]?.[Math.floor(x)]!=="0";
onkeydown=ev=>{keys[ev.code]=1;if(ev.code==="Space")shoot();if(ev.code==="KeyR")ammo=30};onkeyup=ev=>keys[ev.code]=0;
function cast(a){let d=0;while(d<20){d+=.02;if(wall(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d))break}return d}
function enemyView(){const dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy);let ang=Math.atan2(dy,dx)-p.a;ang=Math.atan2(Math.sin(ang),Math.cos(ang));return{dist,ang,vis:Math.abs(ang)<FOV/2+.2&&cast(p.a+ang)>dist}}
function shoot(){if(ammo<=0||p.hp<=0)return;ammo--;flash=4;recoil=10;const v=enemyView();if(!e.dead&&v.vis&&Math.abs(v.ang)<.6/v.dist){if(--e.hp<=0){e.dead=true;msg.textContent="ENEMY DOWN"}}}
function move(dx,dy){if(!wall(p.x+dx*3,p.y))p.x+=dx;if(!wall(p.x,p.y+dy*3))p.y+=dy}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
 if(p.hp>0){const s=2.5*dt,c=Math.cos(p.a),n=Math.sin(p.a);
  if(keys.KeyW||keys.ArrowUp)move(c*s,n*s);if(keys.KeyS||keys.ArrowDown)move(-c*s,-n*s);
  if(keys.KeyA)move(n*s,-c*s);if(keys.KeyD)move(-n*s,c*s);
  if(keys.ArrowLeft||keys.KeyQ)p.a-=2.2*dt;if(keys.ArrowRight||keys.KeyE)p.a+=2.2*dt;}
 const v=enemyView();
 if(!e.dead&&p.hp>0){if(v.dist>2){const k=1.2*dt/v.dist,nx=e.x-(e.x-p.x)*k,ny=e.y-(e.y-p.y)*k;if(!wall(nx,e.y))e.x=nx;if(!wall(e.x,ny))e.y=ny}
  e.cd-=dt;if(e.cd<=0&&v.vis){e.cd=1.2;if(Math.random()<.5){p.hp-=10;if(p.hp<=0){p.hp=0;msg.textContent="YOU DIED"}}}}
 let h="";const cw=W/R;
 for(let i=0;i<R;i++){const ra=p.a-FOV/2+FOV*i/R,d=cast(ra)*Math.cos(ra-p.a),wh=Math.min(H*2,H/d),sh=Math.max(20,200-d*25)|0;
  h+=`<rect x="${(i*cw).toFixed(1)}" y="${(H/2-wh/2).toFixed(1)}" width="${(cw+.6).toFixed(1)}" height="${wh.toFixed(1)}" fill="rgb(${sh},${sh*.9|0},${sh*.75|0})"/>`}
 walls.innerHTML=h;
 let eh="";if(v.vis){const sx=W/2+v.ang/(FOV/2)*W/2,sz=H/v.dist,top=H/2-sz/2,col=e.dead?"#555":"#4a5a2a";
  eh=e.dead?`<rect x="${sx-sz*.3}" y="${H/2+sz*.35}" width="${sz*.6}" height="${sz*.15}" fill="${col}"/>`:
  `<circle cx="${sx}" cy="${top+sz*.12}" r="${sz*.1}" fill="#c9a07a"/><rect x="${sx-sz*.12}" y="${top+sz*.02}" width="${sz*.24}" height="${sz*.07}" fill="#334022"/>
   <rect x="${sx-sz*.15}" y="${top+sz*.22}" width="${sz*.3}" height="${sz*.38}" fill="${col}"/>
   <rect x="${sx-sz*.13}" y="${top+sz*.6}" width="${sz*.1}" height="${sz*.38}" fill="#2e3320"/><rect x="${sx+sz*.03}" y="${top+sz*.6}" width="${sz*.1}" height="${sz*.38}" fill="#2e3320"/>
   <rect x="${sx-sz*.25}" y="${top+sz*.3}" width="${sz*.35}" height="${sz*.06}" fill="#111"/>${e.cd>1.1?`<circle cx="${sx-sz*.27}" cy="${top+sz*.33}" r="${sz*.05}" fill="#ff0"/>`:""}`}
 enemy.innerHTML=eh;
 recoil*=.8;gun.setAttribute("transform",`translate(${Math.sin(t/200)*((keys.KeyW||keys.KeyS)?4:0)},${recoil+Math.abs(Math.cos(t/200))*((keys.KeyW||keys.KeyS)?4:0)})`);
 document.getElementById("flash").setAttribute("r",flash-->0?28:0);
 hud.textContent=`HP ${p.hp} | Ammo ${ammo}/30  —  WASD حرکت | ←→/Q E چرخش | Space شلیک | R ریلود`;
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
